<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 140" role="img" aria-label="ML Obras - Construcciones">
  <defs>
    <linearGradient id="mlgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <g>
    <rect x="10" y="20" width="115" height="100" rx="22" fill="url(#mlgrad)"/>
    <!-- Monograma ML construido con líneas tipo viga -->
    <g fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M32 96 V44 l24 26 24 -26 V96"/>
    </g>
    <g fill="none" stroke="#BFDBFE" stroke-width="9" stroke-linecap="square">
      <path d="M92 44 V96 H112"/>
    </g>
  </g>

  <g font-family="'Sora','Segoe UI',system-ui,sans-serif">
    <text x="140" y="72" font-size="46" font-weight="800" fill="#0F172A" letter-spacing="0.5">ML OBRAS</text>
    <text x="150" y="103" font-size="18" font-weight="600" fill="#2563EB" letter-spacing="4.5">CONSTRUCCIONES</text>
  </g>
</svg>
